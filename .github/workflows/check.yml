name: Check
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A new push to a PR cancels the run still going for the old commit.
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Install Go
      uses: actions/setup-go@v6
      with:
        # Read from go.mod so the CI Go version can never drift from the repo.
        go-version-file: go.mod
    - name: Lint
      uses: golangci/golangci-lint-action@v9
      with:
        # Pinned. "latest" means an upstream release can break CI with no
        # change on our side.
        version: v2.13.1
    - name: Build
      run: go build -o kwatch ./cmd/kwatch
    - name: Test
      run: go test -race --coverprofile=coverage.txt --covermode=atomic ./...
    - name: Integration tests
      run: go test -race -tags integration ./internal/integration/...
    - name: Upload coverage to Codecov
      if: success() && github.ref == 'refs/heads/main'
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

  chart:
    name: Chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Detect chart changes
      id: changes
      uses: dorny/paths-filter@v3
      with:
        filters: |
          chart:
            - 'deploy/chart/**'
    - name: Install Helm
      if: steps.changes.outputs.chart == 'true'
      uses: azure/setup-helm@v4
    - name: Lint chart
      if: steps.changes.outputs.chart == 'true'
      run: helm lint deploy/chart
    - name: Template tests
      if: steps.changes.outputs.chart == 'true'
      run: ./deploy/chart/test_helm.sh
