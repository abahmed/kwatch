name: Check
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A new push to a PR cancels the run still going for the old commit.
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Install Go
      uses: actions/setup-go@v6
      with:
        # Read from go.mod so the CI Go version can never drift from the repo.
        go-version-file: go.mod
    - name: Lint
      uses: golangci/golangci-lint-action@v9
      with:
        # Pinned. "latest" means an upstream release can break CI with no
        # change on our side.
        version: v2.13.1
    - name: Build
      run: go build -o kwatch ./cmd/kwatch
    - name: Test
      run: go test -race --coverprofile=coverage.txt --covermode=atomic ./...
    - name: Integration tests
      run: go test -race -tags integration ./internal/integration/...
    - name: Upload coverage to Codecov
      if: success() && github.ref == 'refs/heads/main'
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

  chart:
    name: Chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Detect chart changes
      id: changes
      uses: dorny/paths-filter@v4
      with:
        filters: |
          chart:
            - 'deploy/chart/**'
    - name: Install Helm
      if: steps.changes.outputs.chart == 'true'
      uses: azure/setup-helm@v5
    - name: Lint chart
      if: steps.changes.outputs.chart == 'true'
      run: helm lint deploy/chart
    - name: Template tests
      if: steps.changes.outputs.chart == 'true'
      run: ./deploy/chart/test_helm.sh

  # publish.yml is the only other place a container image gets built, and it
  # runs on a release — after the tag exists. Without this job a broken
  # Dockerfile is only discovered once it is already shipping.
  image:
    name: Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Detect image changes
      id: changes
      uses: dorny/paths-filter@v4
      with:
        filters: |
          image:
            - 'Dockerfile'
            - '.dockerignore'
            - 'go.mod'
            - 'go.sum'
    - name: Set up QEMU
      if: steps.changes.outputs.image == 'true'
      uses: docker/setup-qemu-action@v4
    - name: Set up Docker Buildx
      if: steps.changes.outputs.image == 'true'
      uses: docker/setup-buildx-action@v4
    # Same platform list as the release build. Nothing is pushed, and the
    # cache is read-only so pull requests never add to the repo cache quota.
    - name: Build every release platform
      if: steps.changes.outputs.image == 'true'
      uses: docker/build-push-action@v7
      with:
        platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
        context: .
        push: false
        cache-from: type=gha
        build-args: |
          RELEASE_VERSION=ci
          GIT_COMMIT=${{ github.sha }}
          BUILD_DATE=ci
    # A cross-compile that silently falls back to the host would still build
    # and still push, producing amd64 binaries inside arm manifests. Only
    # inspecting the binary catches that.
    - name: Verify each binary is built for its own architecture
      if: steps.changes.outputs.image == 'true'
      run: |
        set -euo pipefail
        check() {
          docker buildx build --platform "$1" --output "type=local,dest=/tmp/$2" .
          got=$(file -b "/tmp/$2/bin/kwatch")
          echo "$1 -> $got"
          echo "$got" | grep -q "$3" || { echo "::error::$1 produced the wrong architecture"; exit 1; }
        }
        check linux/amd64  amd64 "x86-64"
        check linux/arm64  arm64 "ARM aarch64"
        check linux/arm/v7 armv7 "ARM, EABI5"
    - name: Smoke-test the image
      if: steps.changes.outputs.image == 'true'
      run: |
        set -euo pipefail
        docker buildx build --platform linux/amd64 --load -t kwatch:ci \
          --build-arg RELEASE_VERSION=ci .
        docker run --rm kwatch:ci --version
