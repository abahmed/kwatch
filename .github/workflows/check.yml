name: Check
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
          ref: ${{ github.ref }}
    - name: Install Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.27'
    - name: Lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest
    - name: Build
      run: go build -o kwatch ./cmd/kwatch
    - name: Test
      run: go test -race --coverprofile=coverage.txt --covermode=atomic ./...
    - name: Integration tests
      run: go test -race -tags integration ./internal/integration/...
    - name: Upload coverage to Codecov
      if: success() && github.ref == 'refs/heads/main'
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

  chart:
    name: Chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Detect chart changes
      id: changes
      uses: dorny/paths-filter@v3
      with:
        filters: |
          chart:
            - 'deploy/chart/**'
    - name: Install Helm
      if: steps.changes.outputs.chart == 'true'
      uses: azure/setup-helm@v4
    - name: Lint chart
      if: steps.changes.outputs.chart == 'true'
      run: helm lint deploy/chart
    - name: Template tests
      if: steps.changes.outputs.chart == 'true'
      run: ./deploy/chart/test_helm.sh
