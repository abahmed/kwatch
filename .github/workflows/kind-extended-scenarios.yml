name: Extended Kind scenarios

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source ref; main is resolved to an immutable SHA"
        required: false
        default: "main"
        type: string
      scenario:
        description: "Extended Kind scenario test regex"
        required: false
        default: "TestScenarioExtended"
        type: string
      keep_cluster:
        description: "Keep the Kind cluster for debugging"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  kind-extended-scenarios:
    name: Extended Kind scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Kind
        run: |
          curl -fsSL -o kind \
            https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
          kind version

      - name: Resolve source commit
        env:
          SOURCE_REF: "${{ inputs.source_ref }}"
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git ls-remote origin "refs/heads/$SOURCE_REF" \
            | cut -f1)"
          if [ -z "$SOURCE_SHA" ]; then
            SOURCE_SHA="$(git ls-remote origin "refs/tags/$SOURCE_REF" \
              | cut -f1)"
          fi
          test -n "$SOURCE_SHA"
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"
          echo "KWATCH_SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

      - name: Run extended Kind scenarios
        env:
          SCENARIO_REGEX: "${{ inputs.scenario }}"
          KEEP_CLUSTER: "${{ inputs.keep_cluster }}"
          KIND_CLUSTER_NAME: "kwatch-extended-${{ github.run_id }}"
          ARTIFACTS: "${{ runner.temp }}/kwatch-kind-extended-e2e"
          SOURCE_REF: "${{ inputs.source_ref }}"
        run: ./scripts/test-kind-extended-scenarios.sh

      - name: Upload extended Kind diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kwatch-kind-extended-e2e-${{ github.run_id }}
          path: ${{ runner.temp }}/kwatch-kind-extended-e2e
          if-no-files-found: warn
