name: Real-cluster scenarios

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Optional scenario test regex"
        required: false
        default: "TestScenario"
        type: string
      family:
        description: "Optional scenario family"
        required: false
        default: ""
        type: string
      shard:
        description: "Optional shard value"
        required: false
        default: ""
        type: string
      keep_cluster:
        description: "Keep the Kind cluster after failure"
        required: false
        default: false
        type: boolean
      suite_timeout:
        description: "Maximum Go test duration"
        required: false
        default: "60m"
        type: string
      reported_ref:
        description: "Release tag or commit to compare with main"
        required: false
        default: ""
        type: string
      reported_version:
        description: "Optional human-readable reported Kwatch version"
        required: false
        default: ""
        type: string
      compare_with_main:
        description: >-
          Run the reported ref and latest main in separate Kind clusters
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: scenarios-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  scenarios:
    name: Kind regression scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 1

      - name: Install Kind
        run: |
          curl -fsSL -o kind \
            https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
          kind version

      - name: Resolve source commit
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git ls-remote origin \
            refs/heads/main | cut -f1)"
          test -n "$SOURCE_SHA"
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"
          {
            echo "SOURCE_SHA=$SOURCE_SHA"
            echo "REQUESTED_REF=main"
          } >> "$GITHUB_ENV"
          {
            echo "requested_ref=main"
            echo "resolved_sha=$SOURCE_SHA"
          } > "${RUNNER_TEMP}/kwatch-source.txt"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run all Kind scenarios
        env:
          ARTIFACTS: "${{ runner.temp }}/kwatch-e2e"
          KIND_CLUSTER_NAME: "kwatch-e2e-${{ github.run_id }}"
          KEEP_CLUSTER: "${{ inputs.keep_cluster }}"
          SCENARIO_REGEX: "${{ inputs.scenario }}"
          SCENARIO_FAMILY: "${{ inputs.family }}"
          SCENARIO_SHARD: "${{ inputs.shard }}"
          SOURCE_REF: main
          SUITE_TIMEOUT: "${{ inputs.suite_timeout }}"
          REPORTED_REF: "${{ inputs.reported_ref }}"
          REPORTED_VERSION: "${{ inputs.reported_version }}"
          COMPARE_WITH_MAIN: "${{ inputs.compare_with_main }}"
        run: |
          set -euo pipefail
          if [ "$COMPARE_WITH_MAIN" = true ]; then
            test -n "$REPORTED_REF" || {
              echo "reported_ref is required in compare mode" >&2
              exit 2
            }
            ./scripts/test-kind-scenarios-compare.sh
          else
            ./scripts/test-kind-scenarios.sh
          fi

      - name: Upload scenario diagnostics
        if: always()
        # actions/upload-artifact v7.0.1
        uses: >-
          actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kwatch-e2e-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/kwatch-e2e
            ${{ runner.temp }}/kwatch-source.txt
          if-no-files-found: warn
