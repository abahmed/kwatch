name: E2E

# Real-cluster validation in disposable Kind clusters:
#   - scenarios: the semantic regression suite from source manifests
#     (test/e2e), optionally comparing a reported ref with main;
#   - operational: the Helm production smoke test (install, RBAC, Lease
#     handover, restart, upgrade, rollback, control-plane node restart)
#     across the RBAC and Secret-watching chart modes.
#
# Runs nightly on main, on demand, and on pull requests labelled `e2e`.
# Pull-request runs use the pull_request event, so a fork receives no
# secrets and a read-only token.
#
# The release workflow requires a successful "E2E full" run on the commit it
# tags; run-name marks filtered and compare runs so they never satisfy it.
run-name: >-
  ${{ github.event_name == 'pull_request' && 'E2E (pull request)'
  || inputs.compare_with_main && 'E2E compare'
  || (inputs.scenario != '' || inputs.family != '' || inputs.shard != ''
  || (inputs.suite != '' && inputs.suite != 'all')) && 'E2E filtered'
  || 'E2E full' }}

on:
  schedule:
    - cron: "23 2 * * *"
  pull_request:
    branches: [ main ]
    types: [ labeled, opened, synchronize, reopened ]
  workflow_dispatch:
    inputs:
      suite:
        description: "Which suites to run"
        required: false
        default: all
        type: choice
        options:
          - all
          - scenarios
          - operational
      scenario:
        description: "Optional scenario test regex (not with family)"
        required: false
        default: ""
        type: string
      family:
        description: >-
          Optional scenario family from test/e2e/coverage/coverage.yaml
          (not with scenario)
        required: false
        default: ""
        type: string
      shard:
        description: "Optional shard value"
        required: false
        default: ""
        type: string
      keep_cluster:
        description: "Keep the Kind cluster after failure"
        required: false
        default: false
        type: boolean
      suite_timeout:
        description: "Maximum Go test duration"
        required: false
        default: "60m"
        type: string
      reported_ref:
        description: "Release tag or commit to compare with main"
        required: false
        default: ""
        type: string
      reported_version:
        description: "Optional human-readable reported Kwatch version"
        required: false
        default: ""
        type: string
      compare_with_main:
        description: >-
          Run the reported ref and latest main in separate Kind clusters
        required: false
        default: false
        type: boolean
      load_count:
        description: "Disposable Pods used by the operational event burst"
        required: false
        default: "50"
        type: string

permissions:
  contents: read

# A new push to a pull request cancels the older run of that push. Label
# events get their own group and never cancel anything: adding an unrelated
# label to a pull request must not kill an in-flight run.
concurrency:
  group: e2e-${{ github.event_name }}-${{ github.event.action }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' }}

env:
  KIND_VERSION: v0.30.0

jobs:
  # The images are built once here and loaded by every job below, instead of
  # being rebuilt in each of them. Compare mode builds its own images from
  # two different sources, so it does not use them.
  build:
    name: Build e2e images
    if: >-
      (github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'e2e'))
      && !inputs.compare_with_main
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build and save images
        run: ./scripts/build-e2e-images.sh "${RUNNER_TEMP}/e2e-images.tar.gz"

      - name: Upload images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kwatch-e2e-images-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-images.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  scenarios:
    needs: build
    name: >-
      Kind regression scenarios${{ matrix.shard != '' && format(' ({0})', matrix.shard) || '' }}
    if: >-
      !cancelled() && (needs.build.result == 'success'
      || inputs.compare_with_main)
      && (github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'e2e'))
      && (github.event_name != 'workflow_dispatch'
      || inputs.suite == 'all' || inputs.suite == 'scenarios')
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    # The full suite is split over six Kind clusters that run in parallel.
    # The shard count is only this list: scenarios are dealt to shards by
    # test/e2e/scenarios/sharding_test.go, so any count works. Each extra
    # shard costs a few minutes of cluster setup and cold start. A filtered or compare
    # run keeps one cluster, since its own filter already picks the
    # scenarios.
    strategy:
      fail-fast: false
      matrix:
        shard: >-
          ${{ fromJSON(
          (inputs.scenario != '' || inputs.family != '' || inputs.shard != ''
          || inputs.compare_with_main) && '[""]'
          || '["1/6","2/6","3/6","4/6","5/6","6/6"]') }}
    env:
      SOURCE_REF: >-
        ${{ inputs.compare_with_main && 'main' || github.ref_name }}
    steps:
      - name: Validate inputs
        env:
          SCENARIO: ${{ inputs.scenario }}
          FAMILY: ${{ inputs.family }}
          COMPARE_WITH_MAIN: ${{ inputs.compare_with_main }}
          REPORTED_REF: ${{ inputs.reported_ref }}
        run: |
          set -euo pipefail
          if [ -n "$SCENARIO" ] && [ -n "$FAMILY" ]; then
            echo "::error::set either scenario or family, not both"
            exit 2
          fi
          if [ "$COMPARE_WITH_MAIN" = true ] && [ -z "$REPORTED_REF" ]; then
            echo "::error::reported_ref is required in compare mode"
            exit 2
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.compare_with_main && 'main' || '' }}
          # Compare mode fetches the reported ref itself.
          fetch-depth: ${{ inputs.compare_with_main && '0' || '1' }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # go install verifies the module against the Go checksum database, so
      # the kind binary is authenticated without a hand-maintained hash.
      - name: Install Kind
        run: |
          set -euo pipefail
          go install "sigs.k8s.io/kind@${KIND_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/kind" version

      - name: Resolve source commit
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          test -n "$SOURCE_SHA"
          {
            echo "SOURCE_SHA=$SOURCE_SHA"
            echo "REQUESTED_REF=$SOURCE_REF"
          } >> "$GITHUB_ENV"
          {
            echo "requested_ref=$SOURCE_REF"
            echo "resolved_sha=$SOURCE_SHA"
          } > "${RUNNER_TEMP}/kwatch-source.txt"

      - name: Download e2e images
        if: ${{ !inputs.compare_with_main }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kwatch-e2e-images-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-images

      - name: Load e2e images
        if: ${{ !inputs.compare_with_main }}
        run: docker load --input "${RUNNER_TEMP}/e2e-images/e2e-images.tar.gz"

      - name: Run Kind scenarios
        env:
          KWATCH_PREBUILT_IMAGES: "${{ !inputs.compare_with_main }}"
          ARTIFACTS: "${{ runner.temp }}/kwatch-e2e"
          KIND_CLUSTER_NAME: "kwatch-e2e-${{ github.run_id }}"
          KEEP_CLUSTER: "${{ inputs.keep_cluster || false }}"
          SCENARIO_REGEX: "${{ inputs.scenario }}"
          SCENARIO_FAMILY: "${{ inputs.family }}"
          SCENARIO_SHARD: "${{ inputs.shard || matrix.shard }}"
          SUITE_TIMEOUT: "${{ inputs.suite_timeout || '60m' }}"
          # A run filtered to some scenarios is a debugging run: log every
          # finding and incident membership change.
          KWATCH_VERBOSITY: "${{ inputs.scenario != '' && '4' || '' }}"
          KWATCH_E2E_RUN_KNOWN_GAPS: "${{ inputs.scenario != '' }}"
          REPORTED_REF: "${{ inputs.reported_ref }}"
          REPORTED_VERSION: "${{ inputs.reported_version }}"
          COMPARE_WITH_MAIN: "${{ inputs.compare_with_main || false }}"
        run: |
          set -euo pipefail
          if [ "$COMPARE_WITH_MAIN" = true ]; then
            ./scripts/test-kind-scenarios-compare.sh
          else
            ./scripts/test-kind-scenarios.sh
          fi

      - name: Upload scenario diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kwatch-e2e-${{ github.run_id }}-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/kwatch-e2e
            ${{ runner.temp }}/kwatch-source.txt
          if-no-files-found: warn

  operational:
    needs: build
    name: Operational smoke (${{ matrix.rbac }}, secrets=${{ matrix.secrets }})
    if: >-
      (github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'e2e'))
      && (github.event_name != 'workflow_dispatch'
      || ((inputs.suite == 'all' || inputs.suite == 'operational')
      && !inputs.compare_with_main))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        rbac: [ full, least-privilege ]
        secrets: [ true, false ]
    env:
      # One name for the cluster kind-action creates and the script loads
      # the image into.
      KIND_CLUSTER_NAME: kwatch-ops
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Create disposable Kubernetes cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: ${{ env.KIND_CLUSTER_NAME }}

      # The scenarios' Kwatch image, which the smoke test only needs under
      # another name.
      - name: Download e2e images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kwatch-e2e-images-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-images

      - name: Tag image
        run: |
          set -euo pipefail
          docker load --input "${RUNNER_TEMP}/e2e-images/e2e-images.tar.gz"
          docker tag "kwatch:e2e-$(git rev-parse HEAD)" kwatch:ci

      - name: Run production smoke test
        env:
          KWATCH_LOAD_COUNT: ${{ inputs.load_count || '50' }}
          KWATCH_RBAC_MODE: ${{ matrix.rbac }}
          KWATCH_WATCH_SECRETS: ${{ matrix.secrets }}
        run: ./scripts/test-kind-production.sh

      - name: Collect cluster diagnostics
        if: always()
        run: |
          kubectl get pods --all-namespaces -o wide || true
          kubectl get events --all-namespaces --sort-by=.lastTimestamp || true
