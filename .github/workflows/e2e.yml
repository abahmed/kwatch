name: E2E

# One-off real-install check. Lives only on a throwaway branch: it borrows
# this file name because a dispatchable workflow must already exist on the
# default branch. No secrets.
run-name: Real install check

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KYVERNO_CHART: "3.9.2"
  ESO_CHART: "2.14.0"

jobs:
  real-install:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: real
      - name: Install Kyverno and External Secrets
        run: |
          helm repo add kyverno https://kyverno.github.io/kyverno/
          helm repo add external-secrets https://charts.external-secrets.io
          helm repo update
          helm search repo kyverno/kyverno --versions | head -5
          helm search repo external-secrets/external-secrets --versions | head -5
          helm install kyverno kyverno/kyverno --version "$KYVERNO_CHART" -n kyverno --create-namespace \
            --wait --timeout 8m
          helm install eso external-secrets/external-secrets --version "$ESO_CHART" \
            -n external-secrets --create-namespace --wait --timeout 8m
          helm list -A
      - name: Build and install kwatch
        run: |
          docker build -t kwatch:real --build-arg GO_BUILD_TAGS=licensetest .
          kind load docker-image kwatch:real --name real
          python3 - <<'E'
          import re
          s=open("deploy/deploy.yaml").read()
          s=re.sub(r"image: \S*kwatch\S*", "image: kwatch:real", s)
          open("/tmp/deploy.yaml","w").write(s)
          E
          kubectl apply -f deploy/crd.yaml || true
          kubectl apply -f /tmp/deploy.yaml
          kubectl -n kwatch create secret generic kwatch \
            --from-literal=config.yaml="$(printf 'healthCheck:\n  enabled: true\n  statusEndpoint: true\n')" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n kwatch set env deployment/kwatch KWATCH_EDITION_OVERRIDE=pro
          sleep 90
          kubectl -n kwatch get pods -o wide
      - name: Create the workload
        run: |
          kubectl create namespace demo
          kubectl -n demo create secret generic store-token --from-literal=token=t
          kubectl apply -f - <<'E'
          apiVersion: kyverno.io/v1
          kind: ClusterPolicy
          metadata: {name: require-team}
          spec:
            validationFailureAction: Audit
            background: true
            rules:
              - name: team-label
                match: {any: [{resources: {kinds: [Pod]}}]}
                validate:
                  message: team label is required
                  pattern: {metadata: {labels: {team: "?*"}}}
          ---
          apiVersion: external-secrets.io/v1
          kind: ClusterSecretStore
          metadata: {name: fake}
          spec:
            provider:
              fake:
                data:
                  - {key: present, value: hello}
          ---
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata: {name: flaky, namespace: demo}
          spec:
            refreshInterval: 30s
            secretStoreRef: {name: fake, kind: ClusterSecretStore}
            target: {name: flaky}
            data:
              - secretKey: v
                remoteRef: {key: late}
          E
          kubectl -n demo run unlabelled --image=registry.k8s.io/pause:3.10
      - name: Let it fail, then fix it
        run: |
          mkdir -p out
          sleep 420
          kubectl get clusterpolicy require-team -o yaml > out/clusterpolicy-failing-phase.yaml
          kubectl -n demo get externalsecret flaky -o yaml > out/externalsecret-failing.yaml
          kubectl get pods -n kwatch -o name | head -1 | xargs -I{} kubectl -n kwatch port-forward {} 8060:8060 &
          sleep 5; curl -s localhost:8060/status > out/status-failing.json || true
          kubectl patch clustersecretstore fake --type=json -p \
            '[{"op":"add","path":"/spec/provider/fake/data/-","value":{"key":"late","value":"now"}}]'
          sleep 600
          curl -s localhost:8060/status > out/status-after.json || true
      - name: Collect
        if: always()
        run: |
          mkdir -p out
          kubectl get clusterpolicy -o yaml > out/clusterpolicy.yaml || true
          kubectl get externalsecret -A -o yaml > out/externalsecret.yaml || true
          kubectl get clustersecretstore -o yaml > out/secretstore.yaml || true
          kubectl get events -A --field-selector type=Warning -o wide > out/warnings.txt || true
          kubectl get policyreport,ephemeralreport -A > out/reports.txt 2>&1 || true
          kubectl get pods -A > out/pods.txt
          kubectl -n kwatch logs -l app.kubernetes.io/name=kwatch --tail=-1 > out/kwatch.log 2>&1 || true
          kubectl -n kwatch logs deploy/kwatch --tail=-1 >> out/kwatch.log 2>&1 || true
          kubectl -n kwatch logs sts/kwatch --tail=-1 >> out/kwatch.log 2>&1 || true
          grep -E 'incident (opened|resolved)' out/kwatch.log > out/incidents.txt || true
          cat out/incidents.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: real-install
          path: out
