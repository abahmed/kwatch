name: "CodeQL Advanced"

# Workflow files are analyzed on every pull request and on main: they are
# small, and a script-injection or permission mistake must be caught before
# merge. Go is analyzed weekly only. The Go extractor cannot fully type-check
# this module (see the note on the go job), each run takes much longer than
# the rest of CI, and pull requests are already covered by golangci-lint,
# govulncheck and the architecture checks in `make ci`.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '34 0 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actions:
    name: Analyze (actions)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
      # only required for workflows in private repositories
      actions: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Initialize CodeQL
      uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
      with:
        languages: actions
        build-mode: none

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
      with:
        category: "/language:actions"

  go:
    name: Analyze (go)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    # Do NOT add actions/setup-go here. The CodeQL Go extractor is built with
    # go1.26.5 and cannot type-check this module (go.mod says go 1.27.0).
    # Putting Go 1.27 on PATH as a real GOROOT turns those extractor failures
    # into ~100 red error annotations without fixing anything. Letting Go
    # auto-download the toolchain into the module cache keeps them quiet.
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Initialize CodeQL
      uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
      with:
        languages: go
        build-mode: autobuild

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
      with:
        category: "/language:go"
