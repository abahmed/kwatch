name: GitHub issue reproduction

on:
  workflow_dispatch:
    inputs:
      issue_url:
        description: "Public GitHub issue containing marked reproduction blocks"
        required: true
        type: string
      reported_image:
        description: "Published image to compare against main (optional)"
        required: false
        default: ""
        type: string
      reported_version:
        description: "Reported version label"
        required: false
        default: ""
        type: string
      reported_source_ref:
        description: "Metadata label for the reported image; never executed"
        required: false
        default: ""
        type: string
      expected_reason:
        description: "Optional expected Kwatch reason, for example CrashLoopBackOff"
        required: false
        default: ""
        type: string
      compare_with_main:
        description: "Run the reported image and main in separate clusters"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: read

jobs:
  reproduce:
    name: Sanitize and run issue reproduction
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Resolve source commit
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          test -n "$SOURCE_SHA"
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

      - name: Build sanitized issue fixture
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          ISSUE_URL: "${{ inputs.issue_url }}"
          FIXTURE: "${{ runner.temp }}/kwatch-issue"
        run: |
          set -euo pipefail
          go run ./cmd/e2eissue -issue "$ISSUE_URL" -output "$FIXTURE" \
            -source-ref "$SOURCE_SHA"
          if [ ! -s "$FIXTURE/config.yaml" ]; then
            cp test/e2e/testdata/base-config.yaml "$FIXTURE/config.yaml"
          fi

      - name: Install Kind
        run: |
          curl -fsSL -o kind \
            https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64
          chmod +x kind
          sudo mv kind /usr/local/bin/kind

      - name: Run sanitized issue reproduction
        env:
          ARTIFACTS: "${{ runner.temp }}/kwatch-e2e"
          ISSUE_FIXTURE_DIR: "${{ runner.temp }}/kwatch-issue"
          KWATCH_CONFIG_FILE: "${{ runner.temp }}/kwatch-issue/config.yaml"
          KIND_CLUSTER_NAME: "kwatch-issue-${{ github.run_id }}"
          SCENARIO_REGEX: "TestScenarioImportedIssue"
          SOURCE_REF: main
          REPORTED_IMAGE: "${{ inputs.reported_image }}"
          REPORTED_VERSION: "${{ inputs.reported_version }}"
          REPORTED_SOURCE_REF: "${{ inputs.reported_source_ref }}"
          COMPARE_WITH_MAIN: "${{ inputs.compare_with_main }}"
          ISSUE_EXPECTED_REASON: "${{ inputs.expected_reason }}"
          ISSUE_NAMESPACE: "kwatch-issue"
        run: |
          if [ "$COMPARE_WITH_MAIN" = true ]; then
            test -n "$REPORTED_IMAGE"
            ./scripts/test-kind-scenario-compare.sh
          else
            ./scripts/test-kind-scenarios.sh
          fi

      - name: Upload sanitized reproduction and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kwatch-issue-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/kwatch-issue
            ${{ runner.temp }}/kwatch-e2e
          if-no-files-found: warn
