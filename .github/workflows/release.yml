name: Release

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'What to cut: rc (pre-release), stable (promote latest RC), or patch (tag an in-main hotfix)'
        required: true
        type: choice
        options:
          - rc
          - stable
          - patch
      bump:
        description: 'For rc only, and only when it opens a NEW series: which part of the last stable moves. Ignored while an RC series is already open, and ignored by stable and patch.'
        required: false
        type: choice
        options:
          - minor
          - major
          - patch
        default: minor
      target:
        description: 'Optional commit sha/ref to tag (defaults to main HEAD). Mainly useful for patch to isolate a hotfix.'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Work out the version and the notes, then stop. Nothing is tagged, released or built.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: ${{ inputs.dry_run && 'Preview' || 'Cut' }} ${{ inputs.command }} release
    runs-on: ubuntu-latest
    steps:
      - name: Guard branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::release must be dispatched from main, got ${{ github.ref }}"
          exit 1

      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Compute version
        id: meta
        env:
          COMMAND: ${{ inputs.command }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          BUMP="${BUMP:-minor}"
          case "$BUMP" in
            major|minor|patch) ;;
            *)
              echo "::error::unknown bump: $BUMP"
              exit 1
              ;;
          esac

          # Match the exact SemVer shapes. A loose "does not contain -rc"
          # filter would treat v1.0.0 as a stable tag, and every version
          # computed from it would then be wrong.
          STABLE_TAGS=$(git tag -l 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V || true)
          LATEST_STABLE=$(echo "$STABLE_TAGS" | tail -1)
          RC_TAGS=$(git tag -l 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$' | sort -V || true)
          LATEST_RC=$(echo "$RC_TAGS" | tail -1)

          strip_rc() { echo "$1" | sed -E 's/-rc\.[0-9]+$//'; }
          rc_num()   { echo "$1" | sed -E 's/.*-rc\.([0-9]+)$/\1/'; }

          # BUMP applied to the last stable. Only rc uses this, and only when
          # it opens a new series.
          bumped() {
            if [ -z "$LATEST_STABLE" ]; then
              case "$BUMP" in
                major) echo "v1.0.0" ;;
                minor) echo "v0.1.0" ;;
                patch) echo "v0.0.1" ;;
              esac
              return
            fi
            local MAJOR MINOR PATCH
            MAJOR=$(echo "$LATEST_STABLE" | sed -E 's/^v([0-9]+)\..*/\1/')
            MINOR=$(echo "$LATEST_STABLE" | sed -E 's/^v[0-9]+\.([0-9]+)\..*/\1/')
            PATCH=$(echo "$LATEST_STABLE" | sed -E 's/^v[0-9]+\.[0-9]+\.([0-9]+)$/\1/')
            case "$BUMP" in
              major) echo "v$((MAJOR + 1)).0.0" ;;
              minor) echo "v$MAJOR.$((MINOR + 1)).0" ;;
              patch) echo "v$MAJOR.$MINOR.$((PATCH + 1))" ;;
            esac
          }

          case "$COMMAND" in
            rc)
              RC_CONSUMED=false
              if [ -n "$LATEST_RC" ]; then
                RC_BASE=$(strip_rc "$LATEST_RC")
                if git rev-parse -q --verify "refs/tags/$RC_BASE" >/dev/null; then
                  RC_CONSUMED=true
                fi
              fi
              if [ -n "$LATEST_RC" ] && [ "$RC_CONSUMED" = false ]; then
                # Series already open, so just take the next number. Comparing
                # against the previous RC keeps the notes to what actually
                # changed, instead of repeating the whole series every time.
                BASE=$(strip_rc "$LATEST_RC")
                LAST_N=$(rc_num "$LATEST_RC")
                PREV="$LATEST_RC"
                echo "::notice::continuing the $BASE series, so the bump input is ignored"
              else
                # Opening a new series. BUMP decides which part moves, so the
                # release type is your call rather than always a minor.
                BASE=$(bumped)
                LAST_N=0
                PREV="$LATEST_STABLE"
              fi
              VERSION="$BASE-rc.$((LAST_N + 1))"
              PRERELEASE=true
              ;;
            stable)
              if [ -z "$LATEST_RC" ]; then
                echo "::error::no RC tags found to promote"
                exit 1
              fi
              VERSION=$(strip_rc "$LATEST_RC")
              PREV="$LATEST_STABLE"
              PRERELEASE=false
              if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
                echo "::error::$VERSION already exists"
                exit 1
              fi
              # main must carry nothing the RC does not already have. An RC tag
              # sits one commit ahead of main on purpose (that commit pins the
              # manifest to the preview image and is never pushed), so compare
              # by reachability rather than by sha equality.
              COUNT=$(git rev-list --count "$LATEST_RC..origin/main")
              if [ "$COUNT" != "0" ]; then
                echo "::error::main has $COUNT commit(s) beyond $LATEST_RC. Cut a fresh RC first."
                exit 1
              fi
              ;;
            patch)
              if [ -z "$LATEST_STABLE" ]; then
                echo "::error::no stable tag found to patch"
                exit 1
              fi
              PATCH=$(echo "$LATEST_STABLE" | sed -E 's/.*\.([0-9]+)$/\1/')
              BASE=$(echo "$LATEST_STABLE" | sed -E 's/\.[0-9]+$//')
              VERSION="$BASE.$((PATCH + 1))"
              PREV="$LATEST_STABLE"
              PRERELEASE=false
              # A patch pushes a commit to main, which moves main past any RC
              # tag still waiting to be promoted.
              if [ -n "$LATEST_RC" ]; then
                RC_BASE=$(strip_rc "$LATEST_RC")
                if ! git rev-parse -q --verify "refs/tags/$RC_BASE" >/dev/null; then
                  echo "::warning::$LATEST_RC is still waiting to be promoted. This patch moves main, so stable will refuse until you cut a fresh RC."
                fi
              fi
              ;;
            *)
              echo "::error::unknown command: $COMMAND"
              exit 1
              ;;
          esac

          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::tag $VERSION already exists"
            exit 1
          fi

          if ! echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "::error::computed version $VERSION is not valid semver"
            exit 1
          fi

          # Go needs a /vN suffix on the module path from major 2 on. Warn
          # rather than block, so the release still goes out.
          NEW_MAJOR=$(echo "$VERSION" | sed -E 's/^v([0-9]+)\..*/\1/')
          if [ "$NEW_MAJOR" -ge 2 ] && ! grep -Eq "^module .*/v$NEW_MAJOR\$" go.mod; then
            echo "::warning::go.mod has no /v$NEW_MAJOR suffix on the module path. Go needs it for major >= 2, so 'go install ...@$VERSION' will fail until go.mod and every internal import are updated."
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "$COMMAND -> $VERSION (notes compare against ${PREV:-nothing})"

      # Must run before the changelog and the bump, so both work on the
      # commit that actually gets tagged.
      - name: Resolve target
        id: target
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if [ -n "$TARGET" ]; then
            if ! git rev-parse -q --verify "$TARGET^{commit}" >/dev/null; then
              echo "::error::target '$TARGET' is not a valid commit, tag, or ref"
              exit 1
            fi
            RESOLVED=$(git rev-parse "$TARGET^{commit}")
          else
            RESOLVED=$(git rev-parse HEAD)
          fi
          echo "sha=$RESOLVED" >> "$GITHUB_OUTPUT"
          echo "tagging at $RESOLVED"

      - name: Generate changelog
        id: changelog
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          PREV: ${{ steps.meta.outputs.prev }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail

          if [ -z "$PREV" ] || ! git rev-parse -q --verify "refs/tags/$PREV" >/dev/null; then
            RANGE="$SHA"
          else
            RANGE="$PREV..$SHA"
          fi

          TOTAL=$(git rev-list --count "$RANGE")
          LOG=$(git log --format='* %s (%h)' "$RANGE" | head -100)
          if [ "$TOTAL" -gt 100 ]; then
            LOG="$LOG
          * ...and $((TOTAL - 100)) more commits."
          fi
          if [ -z "$LOG" ]; then
            LOG="* No changes since $PREV."
          fi

          if [ -n "$PREV" ]; then
            FOOTER="See the [full diff]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$PREV...$VERSION) since \`$PREV\`."
          else
            FOOTER="See the [commit history]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commits/$VERSION)."
          fi

          # Built line by line so YAML block indentation can never leak in.
          {
            echo "## $VERSION"
            echo
            echo "$LOG"
            echo
            echo "---"
            echo "$FOOTER"
          } > /tmp/release-notes.md

          cat /tmp/release-notes.md

      - name: Bump chart and README versions
        id: bump
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMAND: ${{ inputs.command }}
          TARGET: ${{ inputs.target }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail

          # Make the bump on the commit being tagged, not on whatever main is.
          git checkout --detach "$SHA"

          CHART_VER=$(echo "$VERSION" | sed -E 's/^v//')
          export VERSION CHART_VER

          # Rewrite version pins inside one marked block only, so an rc never
          # touches the stable install snippets and a stable never touches the
          # preview ones. Repeated start/end pairs of the same name are fine,
          # which is what lets the clean-up section share the stable marker.
          bump_block() {
            BLOCK="$1" perl -i -pe '
              $in = 1 if /<!--\s*\Q$ENV{BLOCK}\E:start\s*-->/;
              $in = 0 if /<!--\s*\Q$ENV{BLOCK}\E:end\s*-->/;
              if ($in) {
                s/--version \d+\.\d+\.\d+(?:-rc\.\d+)?/--version $ENV{CHART_VER}/g;
                s{kwatch/v\d+\.\d+\.\d+(?:-rc\.\d+)?/}{kwatch/$ENV{VERSION}/}g;
                s{ghcr\.io/abahmed/kwatch:v\d+\.\d+\.\d+(?:-rc\.\d+)?}{ghcr.io/abahmed/kwatch:$ENV{VERSION}}g;
                s/\*\*v\d+\.\d+\.\d+(?:-rc\.\d+)?\*\*/**$ENV{VERSION}**/g;
              }
            ' README.md
          }

          if [ "$COMMAND" = "rc" ]; then
            # Preview snippets only. The chart and deploy manifests stay on the
            # last stable, so a plain kubectl apply from main never ships an rc.
            bump_block rc-install
          else
            bump_block stable-install
            perl -pi -e 's/^version: .*/version: "$ENV{CHART_VER}"/' deploy/chart/Chart.yaml
            perl -pi -e 's/^appVersion: .*/appVersion: "$ENV{VERSION}"/' deploy/chart/Chart.yaml
            perl -pi -e 's/--version [0-9]+\.[0-9]+\.[0-9]+/--version $ENV{CHART_VER}/' deploy/chart/README.md
            perl -pi -e 's#image: ghcr\.io/abahmed/kwatch:[^\n]*#image: ghcr.io/abahmed/kwatch:$ENV{VERSION}#' deploy/deploy.yaml
          fi

          if [ "$COMMAND" = "stable" ]; then
            # The rc this promotes has just shipped, so the preview block has
            # nothing to point at until the next rc opens a series.
            perl -0777 -i -pe 's{(<!-- rc-install:start -->).*?(<!-- rc-install:end -->)}{$1\n\n_No release candidate right now._\n\n$2}s' README.md
            perl -ni -e 'print unless /^>\s*\*\*[^*]*Unreleased\*\*/' README.md docs/*.md
          fi

          # ---- commit 1: what main carries ----
          git add README.md deploy/chart/Chart.yaml deploy/chart/README.md deploy/deploy.yaml docs/
          if git diff --cached --quiet; then
            echo "nothing to bump for main"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: release $VERSION - bump pinned versions"
            if [ -n "$TARGET" ]; then
              # Released off an older commit. The bump belongs to the tag only,
              # since pushing it to main would rewrite main's version backwards.
              echo "::warning::target was set, so the version bump is on the tag only. Update main by hand if it should carry $VERSION."
            else
              if ! git push origin "HEAD:refs/heads/main"; then
                echo "::error::could not push the version bump to main. RELEASE_TOKEN must be a classic PAT with repo scope, allowed to bypass branch protection. Push it manually and re-run:"
                echo "::error::  git push origin $(git rev-parse HEAD):main"
                exit 1
              fi
            fi
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          fi

          # ---- commit 2, rc only: what the tag carries ----
          # The tag must ship a manifest that installs the preview image, so a
          # plain `kubectl apply` at the RC tag just works. This commit is
          # deliberately NOT pushed: main's deploy.yaml keeps pointing at the
          # latest stable, so copying it out of the repo browser can never
          # install a preview build. The tag therefore sits one commit ahead of
          # main, which is why the stable guard compares by reachability.
          if [ "$COMMAND" = "rc" ]; then
            perl -pi -e 's#image: ghcr\.io/abahmed/kwatch:[^\n]*#image: ghcr.io/abahmed/kwatch:$ENV{VERSION}#' deploy/deploy.yaml
            git add deploy/deploy.yaml
            if git diff --cached --quiet; then
              echo "::warning::deploy/deploy.yaml already pins $VERSION; nothing to add to the tag"
            else
              git commit -m "chore: $VERSION - pin manifest to the preview image (tag only)"
            fi
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create tag
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SHA: ${{ steps.bump.outputs.sha || steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          git tag -a "$VERSION" -m "$VERSION" "$SHA"
          git push origin "$VERSION"

      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          SHA: ${{ steps.bump.outputs.sha || steps.target.outputs.sha }}
          # Must NOT be the default GITHUB_TOKEN: releases it creates do not
          # trigger the Publish workflow, so no Docker image gets built.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          PRERELEASE_ARGS=""
          if [ "$PRERELEASE" = "true" ]; then
            PRERELEASE_ARGS="--prerelease"
          fi
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" \
            --notes-file /tmp/release-notes.md \
            $PRERELEASE_ARGS \
            --target "$SHA"

      - name: Summary
        if: ${{ always() && steps.meta.outputs.version != '' }}
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          SHA: ${{ steps.bump.outputs.sha || steps.target.outputs.sha }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          {
            if [ "$DRY" = "true" ]; then
              echo "## Preview: $VERSION"
              echo
              echo "Nothing was tagged, released or built."
            else
              echo "## $VERSION"
            fi
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| version | \`$VERSION\` |"
            echo "| pre-release | $PRERELEASE |"
            echo "| commit | \`$SHA\` |"
            echo "| image | \`ghcr.io/abahmed/kwatch:$VERSION\` |"
            if [ "$PRERELEASE" != "true" ]; then
              echo "| also tagged | \`ghcr.io/abahmed/kwatch:latest\` |"
            fi
            if [ "$DRY" != "true" ]; then
              echo "| release | $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$VERSION |"
            fi
            echo
            echo "### Notes"
            echo
            cat /tmp/release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"
