name: Release

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'What to cut: rc (pre-release), stable (promote latest RC), or patch (tag an in-main hotfix)'
        required: true
        type: choice
        options:
          - rc
          - stable
          - patch
      target:
        description: 'Optional commit sha/ref to tag (defaults to main HEAD). Mainly useful for patch to isolate a hotfix.'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Cut ${{ inputs.command }} release
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Compute version
        id: meta
        env:
          COMMAND: ${{ inputs.command }}
        run: |
          set -euo pipefail

          STABLE_TAGS=$(git tag -l 'v[0-9]*' | grep -v -- '-rc' | sort -V || true)
          LATEST_STABLE=$(echo "$STABLE_TAGS" | tail -1)
          RC_TAGS=$(git tag -l 'v*-rc*' | sort -V || true)
          LATEST_RC=$(echo "$RC_TAGS" | tail -1)

          strip_rc() { echo "$1" | sed -E 's/-rc\.[0-9]+$//'; }
          rc_num()   { echo "$1" | sed -E 's/.*-rc\.([0-9]+)$/\1/'; }

          case "$COMMAND" in
            rc)
              if [ -n "$LATEST_RC" ]; then
                BASE=$(strip_rc "$LATEST_RC")
                LAST_N=$(rc_num "$LATEST_RC")
              elif [ -n "$LATEST_STABLE" ]; then
                MAJOR=$(echo "$LATEST_STABLE" | sed -E 's/^v([0-9]+)\..*/\1/')
                MINOR=$(echo "$LATEST_STABLE" | sed -E 's/^v[0-9]+\.([0-9]+)\..*/\1/')
                BASE="v$MAJOR.$((MINOR + 1)).0"
                LAST_N=0
              else
                BASE="v0.1.0"
                LAST_N=0
              fi
              VERSION="$BASE-rc.$((LAST_N + 1))"
              PREV="$LATEST_STABLE"
              PRERELEASE=true
              ;;
            stable)
              if [ -z "$LATEST_RC" ]; then
                echo "::error::no RC tags found to promote"
                exit 1
              fi
              VERSION=$(strip_rc "$LATEST_RC")
              PREV="$LATEST_STABLE"
              PRERELEASE=false
              if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
                echo "::error::$VERSION already exists"
                exit 1
              fi
              RC_COMMIT=$(git rev-list -n 1 "$LATEST_RC")
              MAIN_COMMIT=$(git rev-parse origin/main)
              if [ "$RC_COMMIT" != "$MAIN_COMMIT" ]; then
                COUNT=$(git rev-list --count "$LATEST_RC..origin/main")
                echo "::error::main has $COUNT commit(s) beyond $LATEST_RC. Cut a fresh RC first."
                exit 1
              fi
              ;;
            patch)
              if [ -z "$LATEST_STABLE" ]; then
                echo "::error::no stable tag found to patch"
                exit 1
              fi
              PATCH=$(echo "$LATEST_STABLE" | sed -E 's/.*\.([0-9]+)$/\1/')
              BASE=$(echo "$LATEST_STABLE" | sed -E 's/\.[0-9]+$//')
              VERSION="$BASE.$((PATCH + 1))"
              PREV="$LATEST_STABLE"
              PRERELEASE=false
              ;;
            *)
              echo "::error::unknown command: $COMMAND"
              exit 1
              ;;
          esac

          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::tag $VERSION already exists"
            exit 1
          fi

          if ! echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "::error::computed version $VERSION is not valid semver"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          PREV: ${{ steps.meta.outputs.prev }}
        run: |
          set -euo pipefail
          if [ -z "$PREV" ] || ! git rev-parse -q --verify "refs/tags/$PREV" >/dev/null; then
            LOG=$(git log --format='* %s (%h)' | head -100)
          else
            LOG=$(git log --format='* %s (%h)' "$PREV..HEAD" | head -100)
          fi
          if [ -z "$LOG" ]; then
            LOG="* No changes since $PREV."
          fi
          BODY="## kwatch $VERSION

          $LOG

          ---
          See the [full diff]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$PREV...$VERSION) since \`$PREV\`."
          echo "$BODY" > /tmp/release-notes.md

      - name: Resolve target
        id: target
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if [ -n "$TARGET" ]; then
            if ! git rev-parse -q --verify "$TARGET^{commit}" >/dev/null; then
              echo "::error::target '$TARGET' is not a valid commit, tag, or ref"
              exit 1
            fi
            RESOLVED=$(git rev-parse "$TARGET^{commit}")
          else
            RESOLVED=$(git rev-parse HEAD)
          fi
          echo "sha=$RESOLVED" >> "$GITHUB_OUTPUT"
          echo "tagging at $RESOLVED"

      - name: Create tag
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          git tag -a "$VERSION" -m "kwatch $VERSION" "$SHA"
          git push origin "$VERSION"

      - name: Create GitHub release
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          PRERELEASE_ARGS=""
          [ "$PRERELEASE" = "true" ] && PRERELEASE_ARGS="--prerelease"
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "kwatch $VERSION" \
            --notes-file /tmp/release-notes.md \
            $PRERELEASE_ARGS \
            --target "$SHA"

      - name: Bump chart and README versions
        if: ${{ inputs.command == 'stable' }}
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          CHART_VER=$(echo "$VERSION" | sed -E 's/^v//')
          export VERSION CHART_VER
          perl -pi -e 's/^version: .*/version: "$ENV{CHART_VER}"/' deploy/chart/Chart.yaml
          perl -pi -e 's/^appVersion: .*/appVersion: "$ENV{VERSION}"/' deploy/chart/Chart.yaml
          perl -pi -e 's/--version [0-9]+\.[0-9]+\.[0-9]+/--version $ENV{CHART_VER}/' README.md
          perl -pi -e 's#kwatch/v[0-9]+\.[0-9]+\.[0-9]+/#kwatch/$ENV{VERSION}/#g' README.md
          perl -ni -e 'print unless /^>\s*\*\*[^*]*Unreleased\*\*/' README.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/chart/Chart.yaml README.md
          git commit -m "chore: release $VERSION - bump chart and README versions" \
            || { echo "no changes to commit"; exit 0; }

          if ! git push origin HEAD:main; then
            echo "::warning::could not push version bump to main (branch protection). Push it manually:"
            echo "::warning::  git push origin HEAD:main"
          fi
