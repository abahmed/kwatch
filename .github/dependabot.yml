version: 2

# One weekly pull request for every ecosystem keeps updates reviewable and
# lets the full CI gate run once for the whole set.
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "weekly"

updates:
  - package-ecosystem: "gomod"
    directory: "/"
    commit-message:
      prefix: "⬆️"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
  # The release image and the e2e receiver and workload images. Base images
  # pinned by digest get their digest bumped here.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/test/e2e/receiver"
      - "/test/e2e/workload"
    commit-message:
      prefix: "⬆️"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
  - package-ecosystem: "github-actions"
    directory: "/"
    commit-message:
      prefix: "⬆️"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
