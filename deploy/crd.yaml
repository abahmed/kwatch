apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kwatchconfigs.kwatch.abahmed.dev
  annotations:
    helm.sh/resource-policy: keep
spec:
  group: kwatch.abahmed.dev
  scope: Namespaced
  names:
    plural: kwatchconfigs
    singular: kwatchconfig
    kind: KwatchConfig
    shortNames:
      - kwc
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                namespaces:
                  type: array
                  items:
                    type: string
                reasons:
                  type: array
                  items:
                    type: string
                ignoreContainerNames:
                  type: array
                  items:
                    type: string
                ignorePodNames:
                  type: array
                  items:
                    type: string
                severityByOwnerKind:
                  type: object
                  additionalProperties:
                    type: string
                resyncSeconds:
                  type: integer
                  minimum: 0
                  x-kubernetes-validations:
                    - rule: "self == 0 || self >= 30"
                      message: "resyncSeconds must be 0 (off) or at least 30"
                crd:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                namespaceSelector:
                  type: string
                ignoreContainerMessages:
                  type: array
                  items:
                    type: string
                ignoreNodeReasons:
                  type: array
                  items:
                    type: string
                ignoreNodeMessages:
                  type: array
                  items:
                    type: string
                severityByReason:
                  type: object
                  additionalProperties:
                    type: string
                silences:
                  type: array
                  items:
                    type: object
                    properties:
                      namespaces:
                        type: array
                        items:
                          type: string
                      reasons:
                        type: array
                        items:
                          type: string
                      podNamePatterns:
                        type: array
                        items:
                          type: string
                      containerNames:
                        type: array
                        items:
                          type: string
                      containerMessages:
                        type: array
                        items:
                          type: string
                      eventMessages:
                        type: array
                        items:
                          type: string
                      nodeReasons:
                        type: array
                        items:
                          type: string
                      nodeMessages:
                        type: array
                        items:
                          type: string
                activeProbeMonitor:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                heartbeatMonitor:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    interval:
                      type: integer
                      minimum: 0
                telemetry:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                maintenance:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    annotation:
                      type: string
                    untilAnnotation:
                      type: string
                app:
                  type: object
                  properties:
                    clusterName:
                      type: string
                    disableStartupMessage:
                      type: boolean
                    logFormatter:
                      type: string
                      enum:
                        - text
                        - json
                templates:
                  type: object
                  additionalProperties:
                    type: string
                runbooks:
                  type: object
                  additionalProperties:
                    type: string
                auditLog:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                upgrader:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
