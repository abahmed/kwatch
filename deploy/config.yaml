apiVersion: v1
kind: Namespace
metadata:
  name: kwatch
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Secret
metadata:
  name: kwatch
  namespace: kwatch
stringData:
  config.yaml: |
    # ── General ──────────────────────────────────────────────
    # Periodic informer resync, a safety net for lost watch events
    # (default 300, 0 = off, otherwise at least 30).
    resyncSeconds: <seconds>

    # ── Scope: what is delivered ──────────────────────────
    # kwatch watches every supported resource; scope only filters delivery.
    # An incident is delivered while one finding it explains is in scope.
    namespaces:
      # Prefix with ! to exclude, and quote it: "!kube-system".
      # A bare !name is a YAML tag and does not parse as a string.
      - <optional_namespace>
    reasons:
      - <optional_reason>      # exclude with a quoted "!Reason"
    namespaceSelector:
      "<label_selector>"       # mutually exclusive with namespaces

    # ── Silences (every field set in a rule must match) ──
    silences:
      - nodeReasons: ["<reason>"]
        nodeMessages: ["<message>"]
      # - namespaces: ["<namespace>"]
      # - reasons: ["<reason>"]
      # - podNamePatterns: ["<regex>"]
      # - containerNames: ["<container>"]
      # - containerMessages: ["<substring>"]
      # - eventMessages: ["<substring in a Kubernetes Event message>"]

    # Deprecated shorthands, each becomes one silence rule:
    # ignoreContainerNames, ignorePodNames, ignoreContainerMessages,
    # ignoreNodeReasons, ignoreNodeMessages

    # ── Policy ────────────────────────────────────────────
    severityByReason:
      <reason>: "<severity>"      # checked before owner kind
    severityByOwnerKind:
      <owner_kind>: "<severity>"
    # runbooks:
    #   <reason>: "<url>"         # added to the steps of matching incidents
    maintenance:
      enabled: <boolean>          # default true
      # annotation: kwatch.io/maintenance
      # untilAnnotation: kwatch.io/maintenance-until

    # ── Active probes (opt-in) ────────────────────────────
    # activeProbeMonitor:
    #   enabled: true
    #   http: [{name: api, url: "https://api.example.com/healthz"}]
    #   tcp: [{name: db, address: "db.prod:5432"}]
    #   dns: [{name: registry, host: "registry.example.com"}]

    # ── Heartbeat (dead man's switch) ─────────────────────
    heartbeatMonitor:
      enabled: <boolean>
      # interval: <seconds>            # ping interval (default 300)
      # url must come from a Secret-backed ${file:/absolute/path} reference.

    # ── Audit log (one JSON line per incident decision) ──
    auditLog:
      enabled: <boolean>     # default true
      # output: "stdout"     # "stdout" or a file path

    # ── Text templates for plain-text providers ──────────
    # templates:
    #   <reason>: "{{ .Text }}"

    # ── Health check ──────────────────────────────────────
    healthCheck:
      enabled: <boolean>           # default true
      port: 8060                   # listen port (default 8060)

    # ── App ───────────────────────────────────────────────
    app:
      clusterName: "<cluster_name>"
      # proxyURL: "<url>"
      # disableStartupMessage: <boolean>
      # logFormatter: "<text|json>"
      # insecureSkipTLSVerify: <boolean>
      # caBundlePath: "<path>"

    # ── Kubelet ───────────────────────────────────────────
    # Node stats are read directly from each kubelet (port 10250).
    # kubelet:
    #   insecureSkipVerify: false  # only for self-signed kubelet certs

    # ── Watched resources ─────────────────────────────────
    # watch:
    #   secrets: true              # false: no Secret watch or RBAC needed

    # ── Upgrader ──────────────────────────────────────────
    upgrader:
      disableUpdateCheck: <boolean>

    # ── CRD watcher ───────────────────────────────────────
    # crd:
    #   enabled: <boolean>   # restart kwatch when KwatchConfig changes

    # Provider credentials are never valid as plain config values. Use
    # kwatch.sh, or mount a Secret and reference each credential with
    # ${file:/absolute/path}. See docs/providers.md.
    alert: {}
