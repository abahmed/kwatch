{{- $config := default dict .Values.config }}
{{- $health := default dict (index $config "healthCheck") }}
{{- $heartbeat := default dict (index $config "heartbeatMonitor") }}
{{- if and (not .Values.configSecretName) (hasKey $config "alert") }}
{{- fail "config.alert requires configSecretName; credentials cannot be stored in a ConfigMap" }}
{{- end }}
{{- if and (not .Values.configSecretName) (hasKey $health "diagnosticsToken") }}
{{- fail "healthCheck.diagnosticsToken requires configSecretName" }}
{{- end }}
{{- if and (not .Values.configSecretName) (hasKey $heartbeat "url") }}
{{- fail "heartbeatMonitor.url requires configSecretName" }}
{{- end }}
{{- if not .Values.configSecretName }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
data:
  config.yaml: |
    {{- toYaml $config | nindent 4 }}
{{- end }}
