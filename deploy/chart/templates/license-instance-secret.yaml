{{- if include "kwatch.licenseConfigured" . }}
{{- /*
The license instance Secret is shipped pre-created and empty so kwatch needs
only get and update on it (RBAC cannot limit create by name). The template
never renders `data`: kwatch writes the instance key into the live object,
and because neither the previous nor the new manifest has `data`, Helm's
three-way merge leaves it alone on upgrade. The keep policy means helm
uninstall does not delete the instance identity. It is rendered only when a
license key is configured (see kwatch.licenseConfigured), so a Community
install has neither the Secret nor the Role that reads it.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: kwatch-license-instance
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kwatch.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
{{- end }}
