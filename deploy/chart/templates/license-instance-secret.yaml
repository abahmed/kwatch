{{- /*
The license instance Secret is shipped pre-created so kwatch needs only get
and update on it (RBAC cannot limit create by name). `lookup` carries any
existing data over, so helm upgrade never wipes the stored instance key; the
keep policy means helm uninstall does not delete the instance identity.
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "kwatch-license-instance" }}
apiVersion: v1
kind: Secret
metadata:
  name: kwatch-license-instance
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kwatch.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
{{- if and $existing $existing.data }}
data:
  {{- range $k, $v := $existing.data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
