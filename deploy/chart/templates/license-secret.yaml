{{- $license := default dict .Values.license }}
{{- if and $license.key (not $license.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kwatch.licenseSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kwatch.labels" . | nindent 4 }}
type: Opaque
stringData:
  license-key: {{ $license.key | quote }}
{{- end }}
