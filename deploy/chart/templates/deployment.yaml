apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kwatch.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kwatch.labels" . | nindent 4 }}
spec:
  # One writer: the Lease is a lock and Recreate keeps two pods from
  # sharing the RWO state volume.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kwatch.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if .Values.configSecretName }}
        {{- $configSecret := lookup "v1" "Secret" .Release.Namespace .Values.configSecretName }}
        {{- if $configSecret }}
        checksum/config-secret: {{ toJson $configSecret.data | sha256sum }}
        {{- else }}
        checksum/config-secret: {{ .Values.configSecretName | sha256sum }}
        {{- end }}
        {{- else }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "kwatch.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      serviceAccountName:  {{ .Release.Name }}
      automountServiceAccountToken: true
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: health
              containerPort: {{ include "kwatch.healthPort" . }}
          volumeMounts:
          - name: config-volume
            mountPath: /config
          - name: data
            mountPath: /var/lib/kwatch
          env:
            - name: CONFIG_FILE
              value: "/config/config.yaml"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: KWATCH_LEADER_ELECTION_NAME
              value: {{ include "kwatch.leaseName" . | quote }}
            - name: KWATCH_DATA_DIR
              value: "/var/lib/kwatch"
            {{- if .Values.persistence.emptyDir }}
            # Tells kwatch the real size cap of the emptyDir volume, so
            # its storage limits follow it.
            - name: KWATCH_VOLUME_LIMIT
              value: {{ .Values.persistence.emptyDirSizeLimit | default "2Gi" | quote }}
            {{- end }}
            # kwatch sets the Go soft memory limit to 90% of this
            # container limit, unless GOMEMLIMIT is set explicitly.
            - name: KWATCH_MEMORY_LIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
                  divisor: "1"
            # config.crd.enabled reaches kwatch even when config.yaml
            # comes from configSecretName, so the overlay matches the CRD
            # and RBAC this chart installs.
            - name: KWATCH_CRD_ENABLED
              value: {{ dig "crd" "enabled" true (default dict .Values.config) | toString | quote }}
            {{- if eq (include "kwatch.watchSecrets" .) "false" }}
            # watch.secrets=false: matches the RBAC, which grants no
            # Secret access, even when config.yaml comes from a Secret.
            - name: KWATCH_WATCH_SECRETS
              value: "false"
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /availabilityz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- else }}
      {{- with (include "kwatch.storageTopologyKey" . | trim) }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: {{ . }}
                    operator: Exists
      {{- end }}
      {{- end }}
      {{- with (include "kwatch.tolerations" . | trim) }}
      tolerations:
        {{- . | nindent 8 }}
      {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.emptyDir }}
          emptyDir:
            sizeLimit: {{ .Values.persistence.emptyDirSizeLimit | default "2Gi" | quote }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" (include "kwatch.fullname" .)) }}
          {{- end }}
        - name: config-volume
          {{- if .Values.configSecretName }}
          secret:
            secretName: {{ .Values.configSecretName }}
            defaultMode: 0400
          {{- else }}
          configMap:
            name: {{ .Release.Name }}
            defaultMode: 0444
          {{- end }}
