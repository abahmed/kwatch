{{- $dash := default dict .Values.dashboard -}}
{{- if and $dash.enabled (not $dash.existingSecret) }}
{{- $name := include "kwatch.dashboardSecretName" . }}
{{- /* Keep the token and the password across upgrades: reuse the
existing Secret's values. A new password is 16 characters from an
alphabet without 0/O/1/I/L, in four groups of four (about 80 bits). */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- if and $existing $existing.data }}
{{- $data = $existing.data }}
{{- end }}
{{- $token := index $data "token" | default (randAlphaNum 32 | b64enc) }}
{{- $password := index $data "password" }}
{{- if not $password }}
{{- /* crypto/rand bytes, each mapped onto the 32-letter alphabet: 256 is
a multiple of 32, so every letter is equally likely. */}}
{{- $alphabet := "ABCDEFGHJKLMNPQRSTUVWXYZ23456789" }}
{{- $raw := randBytes 16 | b64dec }}
{{- $plain := "" }}
{{- range $i := until 16 }}
{{- if and $i (eq (mod $i 4) 0) }}
{{- $plain = printf "%s-" $plain }}
{{- end }}
{{- $n := mod (int (index $raw $i)) 32 }}
{{- $plain = printf "%s%s" $plain (substr (int $n) (int (add1 $n)) $alphabet) }}
{{- end }}
{{- $password = $plain | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kwatch.labels" . | nindent 4 }}
  annotations:
    # Kept when the release or the dashboard goes away, so a reinstall
    # keeps the password people saved. Delete it to forget the password.
    helm.sh/resource-policy: keep
type: Opaque
data:
  # The bearer token for API clients such as the installer.
  token: {{ $token }}
  # The shared sign-in password of the web dashboard.
  password: {{ $password }}
{{- end }}
