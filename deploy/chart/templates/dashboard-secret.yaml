{{- $dash := default dict .Values.dashboard -}}
{{- if and $dash.enabled (not $dash.existingSecret) }}
{{- $name := include "kwatch.dashboardSecretName" . }}
{{- /*
The dashboard Secret is shipped pre-created and empty. The template never
renders `data` and uses no `lookup` or random function, so every render
(helm template, Argo CD, Flux, CI) is identical. kwatch writes the sign-in
password and the API token into the live object the first time it starts;
Helm's three-way merge leaves keys that neither the previous nor the new
manifest has alone, so upgrades keep them. RBAC cannot limit create by
name, so kwatch only gets and updates this one Secret.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kwatch.labels" . | nindent 4 }}
  annotations:
    # Kept when the release or the dashboard goes away, so a reinstall
    # keeps the password people saved. Delete it to forget the password.
    helm.sh/resource-policy: keep
type: Opaque
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Release.Name }}-dashboard-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kwatch.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: [{{ $name | quote }}]
  verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-dashboard-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kwatch.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-dashboard-credentials
subjects:
- kind: ServiceAccount
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
{{- end }}
