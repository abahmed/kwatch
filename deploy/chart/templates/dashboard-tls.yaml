{{- $d := default dict .Values.dashboard -}}
{{- if and $d.enabled (include "kwatch.dashboardOwnTLS" .) }}
{{- include "kwatch.dashboardCheck" . }}
{{- $tls := default dict $d.tls }}
{{- $secret := include "kwatch.dashboardTLSSecret" . }}
{{- $svc := printf "%s-dashboard" (include "kwatch.fullname" .) }}
{{- $names := list $svc (printf "%s.%s.svc" $svc .Release.Namespace) }}
{{- if $d.host }}
{{- $names = prepend $names $d.host }}
{{- end }}
{{- if $tls.issuer }}
# kwatch serves this certificate itself on the dashboard port.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $svc }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kwatch.labels" . | nindent 4 }}
spec:
  secretName: {{ $secret }}
  issuerRef:
    name: {{ $tls.issuer }}
    kind: {{ default "ClusterIssuer" $tls.issuerKind }}
  dnsNames:
    {{- range $names }}
    - {{ . | quote }}
    {{- end }}
{{- else if $tls.selfSigned }}
{{- /* Generated once and kept across upgrades, like the password. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secret }}
{{- $crt := "" }}
{{- $key := "" }}
{{- if and $existing $existing.data (index $existing.data "tls.crt") }}
{{- $crt = index $existing.data "tls.crt" }}
{{- $key = index $existing.data "tls.key" }}
{{- else }}
{{- $gen := genSelfSignedCert (first $names) nil $names 3650 }}
{{- $crt = $gen.Cert | b64enc }}
{{- $key = $gen.Key | b64enc }}
{{- end }}
# Self-signed: browsers warn until people trust it. kwatch serves it.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kwatch.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $crt }}
  tls.key: {{ $key }}
{{- end }}
{{- end }}
