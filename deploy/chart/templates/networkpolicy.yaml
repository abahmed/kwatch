{{- if .Values.networkPolicy.enabled }}
{{- if and .Values.networkPolicy.allowDefaults (not .Values.networkPolicy.apiServerPorts) }}
{{- fail "networkPolicy.apiServerPorts must list at least one port: an empty list would open all egress" }}
{{- end }}
{{- $port := include "kwatch.healthPort" . | int }}
{{- $dash := default dict .Values.dashboard }}
{{- $dashPort := $dash.port | default 8061 }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kwatch.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kwatch.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kwatch.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if .Values.networkPolicy.allowDefaults }}
    # Health port (/health, /metrics, /status): pods in this namespace,
    # the node ranges in kubeletCIDRs (kubelet probes, when your network
    # plugin enforces policy on node traffic) and the scrapers listed in
    # healthIngressFrom. No other pod in the cluster can reach it.
    # /metrics is part of Pro; Community answers it with 404.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
        {{- range .Values.networkPolicy.kubeletCIDRs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
        {{- range .Values.networkPolicy.healthIngressFrom }}
        -
          {{- toYaml . | nindent 10 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ $port }}
    {{- if $dash.enabled }}
    # Dashboard API (/api/*): bearer-token protected, ClusterIP only.
    # Reachable from this namespace and healthIngressFrom sources.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
        {{- range .Values.networkPolicy.kubeletCIDRs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
        {{- range .Values.networkPolicy.healthIngressFrom }}
        -
          {{- toYaml . | nindent 10 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ $dashPort }}
    {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.ingress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    {{- if .Values.networkPolicy.allowDefaults }}
    # DNS.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kubernetes API server and HTTPS alert providers. The API server
    # address differs per cluster, so these ports are open to any address.
    - ports:
        {{- range .Values.networkPolicy.apiServerPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- if include "kwatch.licenseConfigured" . }}
    # License activation and renewal (api.kwatch.dev, behind Cloudflare, so
    # no fixed address): HTTPS to any address. Rendered only when a license
    # is configured; listed on its own because apiServerPorts may omit 443.
    - ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- with .Values.networkPolicy.dnsMetricsPort }}
    # Cluster DNS metrics (CoreDNS or kube-dns pods): DNS request and
    # SERVFAIL rates.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: TCP
          port: {{ . }}
    {{- end }}
    # Kubelet on every node: kwatch reads node stats and metrics directly.
    - ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.kubeletPort | default 10250 }}
      {{- with .Values.networkPolicy.kubeletCIDRs }}
      to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      {{- end }}
    {{- end }}
    {{- if .Values.networkPolicy.allowProbeEgressAll }}
    # allowProbeEgressAll: active probe targets, autoServices,
    # autoDependencies, a proxy or providers on unusual ports.
    - {}
    {{- end }}
    {{- with .Values.networkPolicy.extraEgressPorts }}
    # extraEgressPorts: provider ports other than 443, such as SMTP
    # (25, 465, 587) or a webhook on a custom port, open to any address.
    - ports:
        {{- range . }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
