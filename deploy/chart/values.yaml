# Default values for kwatch.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Override the base name used in templates
nameOverride: ""
# -- Override the full app name used in templates
fullnameOverride: ""

image:
  repository: ghcr.io/abahmed/kwatch
  # -- Overrides the image tag (defaults to .Chart.AppVersion)
  tag: ""
  pullPolicy: IfNotPresent

securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

podSecurityContext:
  fsGroup: 1000

service:
  port: 8060

# -- Time allowed for workers and persistence savers to stop cleanly.
terminationGracePeriodSeconds: 60

# -- Optional network isolation. When enabled, provide ingress rules for the
# health clients and egress rules for the Kubernetes API, DNS, and providers.
networkPolicy:
  enabled: false
  ingress: []
  egress: []

resources:
  limits:
    memory: 256Mi
    cpu: 100m
  requests:
    memory: 128Mi
    cpu: 100m

# -- State store volume (ADR 0010). Kwatch keeps problems, history and
# delivery threads on disk. Set existingClaim to reuse a PVC, or emptyDir for
# evaluation clusters without storage (state is lost when the pod moves).
persistence:
  size: 2Gi
  storageClass: ""
  existingClaim: ""
  emptyDir: false

nodeSelector: {}

# -- Move off a failed node after 30s; the Lease stops the old pod writing.
tolerations:
  - key: node.kubernetes.io/not-ready
    operator: Exists
    effect: NoExecute
    tolerationSeconds: 30
  - key: node.kubernetes.io/unreachable
    operator: Exists
    effect: NoExecute
    tolerationSeconds: 30

affinity: {}

podAnnotations: {}

sacAnnotations: {}

podLabels: {}

# kwatch configuration. kwatch watches every supported resource; use
# namespaces, reasons, namespaceSelector and silences to narrow what is
# delivered. The chart installs the KwatchConfig CRD and enables live
# configuration overlay by default.
config:
  crd:
    enabled: true

# -- Use an existing Secret containing config.yaml and credential files.
# Required for alert providers, heartbeatMonitor.url, and diagnosticsToken.
configSecretName: ""

# -- Configure the upgrader/update checker (nested under config)
# config:
#   upgrader:
#     disableUpdateCheck: false
