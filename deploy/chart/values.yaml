# Default values for kwatch.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Override the base name used in templates
nameOverride: ""
# -- Override the full app name used in templates
fullnameOverride: ""

image:
  repository: ghcr.io/abahmed/kwatch
  # -- Overrides the image tag (defaults to .Chart.AppVersion)
  tag: ""
  pullPolicy: IfNotPresent

securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  readOnlyRootFilesystem: true

service:
  port: 8060

resources:
  limits:
    memory: 256Mi
    cpu: 100m
  requests:
    memory: 128Mi
    cpu: 100m

nodeSelector: {}

tolerations: []

affinity: {}

podAnnotations: {}

sacAnnotations: {}

podLabels: {}

# kwatch configuration
# All detection monitors are ON by default; see docs.
# resyncSeconds defaults to 0 (event-driven). workers defaults to 1 — raise on large
# clusters (≈1 per few-thousand pods); each worker fans out to ≤7 goroutines.
# To enable TLS monitoring (reads Secrets):
# tlsMonitor:
#   enabled: true
#   threshold: 30
#
# smartGrouping:
#   windowSeconds: 60
config: {}

# -- Configure the upgrader/update checker (nested under config in the ConfigMap)
# config:
#   upgrader:
#     disableUpdateCheck: false



