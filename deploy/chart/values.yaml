# Default values for kwatch.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Override the base name used in templates
nameOverride: ""
# -- Override the full app name used in templates
fullnameOverride: ""

image:
  repository: ghcr.io/abahmed/kwatch
  # -- Overrides the image tag (defaults to .Chart.AppVersion)
  tag: ""
  pullPolicy: IfNotPresent

securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

podSecurityContext:
  fsGroup: 1000

rbac:
  # -- Cluster read access. "least-privilege" (the default) grants an
  # explicit list/watch set matching the built-in sources; kinds outside
  # it, custom resources included, show as permission_denied in /health
  # coverage. "full" grants list/watch on every resource so any API kind,
  # including CRDs installed later, can be watched. Both modes grant get
  # only on namespaces, nodes, nodes/stats and nodes/metrics (kubelet
  # stats, read from each kubelet directly) and pods/log (crash output);
  # a wildcard get is avoided because it would also match pods/exec and
  # similar subresources. nodes/proxy is never granted. Both modes also
  # grant get on pods in the release namespace only, to explain why the
  # previous kwatch Pod restarted, and get/update only on kwatch's own
  # state lock Lease. The license instance key is the one Secret
  # exception: get/update on the name kwatch-license-instance in the
  # release namespace, in both modes and even with watch.secrets=false.
  # Opt back into the wildcard with --set rbac.mode=full.
  mode: least-privilege

watch:
  # -- Watch Secrets. They feed checks such as missing Secret references
  # and certificate expiry; their values are hashed in kwatch's informer
  # cache and never stored or sent. false removes every Secret permission
  # in both RBAC modes (rbac.mode=full then uses the explicit
  # least-privilege list, because RBAC cannot remove one resource from a
  # wildcard), stops the Secret watch, lists Secret as
  # "disabled_by_config" in /health coverage, and checks that need
  # Secrets report that they cannot verify.
  secrets: true

crd:
  # -- Install the cluster-wide KwatchConfig CRD with this release. The CRD
  # is shared by every kwatch release in the cluster and Helm keeps it on
  # uninstall, so only one release can own it. When a CRD owned by another
  # release already exists, this release leaves it alone (a live lookup;
  # offline renders always include it). Set false on every release but one,
  # or when you apply deploy/crd.yaml yourself. config.crd.enabled, below,
  # is a separate switch: it turns the live KwatchConfig overlay on or off.
  install: true

# -- Time allowed for workers and persistence savers to stop cleanly.
terminationGracePeriodSeconds: 60

# -- Optional network isolation, disabled by default: the API server
# address, the kubelet port and every alert provider differ per cluster,
# and a policy that misses one silently stops monitoring or alerting.
# Enable it once you know your egress. With allowDefaults the policy admits
# the health port to its own namespace, the kubeletCIDRs nodes and the
# scrapers in healthIngressFrom (not to every pod in the cluster) and lets
# kwatch reach DNS, TCP
# apiServerPorts on any address (the Kubernetes API server and HTTPS alert
# providers) and the kubelet on every node (kubeletPort, for node stats),
# limited to kubeletCIDRs when set (your node address ranges). Port 443
# covers HTTPS alert providers. A provider on any other port needs it in
# extraEgressPorts: the email provider uses SMTP (25, 465 or 587, matching
# its configured port) and a custom webhook may use its own port. Use
# ingress/egress for full rules (for example to limit a port to one
# address). Set allowDefaults=false only when your own rules cover the API
# server, kubelets and probes; without them kwatch cannot start.
#
# What the defaults do not cover (kwatch dials these itself):
#   - activeProbeMonitor http/tcp/dns targets, and autoServices and
#     autoDependencies targets (any Service or external port);
#   - app.proxyURL (the proxy's port);
#   - alert providers and heartbeat URLs on a port other than 443.
# With the policy on and none of these opened, active probes report every
# target down and providers stop delivering. Open them with
# extraEgressPorts or egress, or set allowProbeEgressAll to admit all egress
# from the pod (ingress stays limited). The defaults do open the cluster DNS
# metrics port (dnsMetricsPort, CoreDNS/kube-dns pods in kube-system), which
# feeds the DNS request and SERVFAIL rates.
networkPolicy:
  enabled: false
  allowDefaults: true
  # -- Must list at least one port: an empty list would open all egress.
  apiServerPorts: [443, 6443]
  # -- Allow all egress from the pod, for active probes, autoServices,
  # autoDependencies, a proxy or providers on unusual ports.
  allowProbeEgressAll: false
  # -- TCP port of the cluster DNS metrics endpoint; 0 omits the rule.
  dnsMetricsPort: 9153
  kubeletPort: 10250
  kubeletCIDRs: []
  # -- Who may reach the health port (/health, /metrics and /status), besides
  # pods in the release namespace and, when set, the kubeletCIDRs nodes. Each
  # entry is a NetworkPolicy peer: a namespaceSelector, a podSelector or an
  # ipBlock. List your Prometheus here, for example
  # [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}}].
  # /metrics is part of Pro; Community answers it with 404.
  healthIngressFrom: []
  # -- Extra TCP egress ports open to any address, e.g. [587] for SMTP.
  extraEgressPorts: []
  ingress: []
  egress: []

# -- kwatch sets the Go soft memory limit (GOMEMLIMIT) to 90% of the
# memory limit, so garbage collection works harder before the kernel would
# kill the Pod. Live heap is about 26 KB per pod: 140 MiB at 5,000 pods and
# 520 MiB at 20,000. The default 512Mi suits up to about 8,000 pods; use
# 768Mi at 10,000 pods and 1Gi at 20,000 (raise the request with the limit).
# See docs/production-operations.md, section Memory.
resources:
  limits:
    memory: 512Mi
    cpu: 500m
  requests:
    memory: 128Mi
    cpu: 100m

# -- State store volume. Kwatch keeps incidents, changes,
# baselines, evidence, timeline, audit, object fingerprints and state
# (thread IDs, notified version) in one file on it. Retention is enforced in
# the background and live data is capped at 512 MiB; the file is
# rewritten at startup once it passes 640 MiB, and that compaction copy
# shares the volume (peak about 1.2 GiB), so keep the volume at 2Gi or
# more. Set
# existingClaim to reuse a PVC, or emptyDir for evaluation clusters without
# storage. emptyDir loses all state when the pod is rescheduled or the node
# fails, so open incidents may be announced again after a restart. The
# Pro lease is not lost: a signed copy lives in kwatch-license-instance.
persistence:
  size: 2Gi
  storageClass: ""
  existingClaim: ""
  emptyDir: false
  # -- sizeLimit applied to the emptyDir volume (emptyDir mode only).
  emptyDirSizeLimit: 2Gi
  # -- Keep kwatch on the nodes where the StorageClass's CSI driver is
  # registered when the driver runs on only some nodes; otherwise a
  # WaitForFirstConsumer claim placed on another node never binds. Looked
  # up at install and upgrade time; offline renders (helm template, Argo
  # CD) cannot look it up and render nothing.
  pinToStorageDriverNodes: true
  # -- The storage driver's topology label to require explicitly, for
  # offline renders (kubectl get csinodes shows each driver's topologyKeys).
  # A node carries it only once the driver is registered there.
  storageDriverTopologyKey: ""

nodeSelector: {}

# -- Extra tolerations. They are merged with defaultTolerations below: your
# list is rendered first and every default whose key and effect are not
# already used by one of your entries is appended, so setting this never
# drops the 30s not-ready/unreachable failover behavior. For example a
# not-ready NoSchedule entry keeps the default not-ready NoExecute one. To
# change a default, add an entry with the same key and effect (an entry
# with no effect covers every effect of its key).
tolerations: []

# -- Move off a failed node after 30s; the Lease stops the old pod writing.
# Merged with tolerations above (a user entry with the same key and effect
# wins). Change tolerationSeconds here to fail over sooner or later. With
# a ReadWriteOnce volume the new pod still waits for the volume to detach
# from the failed node, which the storage driver may take minutes to do.
defaultTolerations:
  - key: node.kubernetes.io/not-ready
    operator: Exists
    effect: NoExecute
    tolerationSeconds: 30
  - key: node.kubernetes.io/unreachable
    operator: Exists
    effect: NoExecute
    tolerationSeconds: 30

affinity: {}

# Kwatch keeps one state file and one lock; evicting its pod costs a
# restart and a gap in monitoring, but a restart resumes from the volume and
# pinning the pod pins its node: Karpenter reports the node as blocked from
# consolidation for as long as the pod runs, so the default does not set
# karpenter.sh/do-not-disrupt. The cluster autoscaler's annotation below is
# kept: it asks that autoscaler not to scale down the node, which has the
# same cost, so remove it (set it to null, for example
# --set 'podAnnotations.cluster-autoscaler\.kubernetes\.io/safe-to-evict=null')
# on a cluster where node scale-down matters more than an uninterrupted pod.
# To ask Karpenter to leave the pod alone, set
# karpenter.sh/do-not-disrupt: "true" here. To limit voluntary disruption
# in general, add your own PodDisruptionBudget: the chart ships none, since
# minAvailable: 1 on a one-pod Deployment would block every drain of its
# node, while maxUnavailable: 1 allows one eviction at a time.
podAnnotations:
  cluster-autoscaler.kubernetes.io/safe-to-evict: "false"

# -- PriorityClass of the kwatch pod. Give it a class above your workloads
# so the pod that reports their failures is not the first one the scheduler
# preempts under node pressure.
priorityClassName: ""

# -- Pull secrets for the kwatch image, for a private registry mirror. Each
# entry is {name: <secret>}.
imagePullSecrets: []

# -- Extra volumes and volume mounts of the kwatch container, for example a
# Secret with a CA bundle that app.caBundlePath names. Names may not be
# config-volume or data.
extraVolumes: []
extraVolumeMounts: []

sacAnnotations: {}

podLabels: {}

# kwatch configuration. kwatch watches every supported resource; use
# namespaces, reasons, namespaceSelector and silences to narrow what is
# delivered. The chart installs the KwatchConfig CRD and enables live
# configuration overlay by default.
#
# config.healthCheck.port sets the container port and the probe port. The
# health server cannot be disabled: the probes need it.
# config.healthCheck.statusEndpoint: true serves the read-only /status view
# (open incidents with object names, no authentication) on that port; it is
# off by default. Reach it with kubectl port-forward, never expose the port.
#
# Two outbound checks are on by default. Anonymous adoption telemetry
# sends an installation ID and the kwatch version at most once every 7
# days; the update check asks the GitHub API at startup and then daily
# whether a newer kwatch release exists, and posts one notice per release
# to your alert providers. Turn them off here, or in the Secret's
# config.yaml when configSecretName is set:
#
#   config:
#     telemetry:
#       enabled: false
#     upgrader:
#       disableUpdateCheck: true
config:
  crd:
    enabled: true

# kwatch Pro license. Without a key kwatch runs the Community edition and
# makes no license call. kwatch reads the key from the KWATCH_LICENSE_KEY
# environment variable, which this chart fills from a Secret key named
# license-key (optional: the pod starts without the Secret). Prefer
# existingSecret: a key in values.yaml lands in release history and GitOps
# repositories. Activation needs HTTPS egress to api.kwatch.dev. kwatch also
# keeps its instance key in the Secret kwatch-license-instance in the release
# namespace; the chart grants access to that one name only (see rbac.yaml).
license:
  # -- Name of an existing Secret with the key `license-key`.
  existingSecret: ""
  # -- The license key itself (discouraged). When set and existingSecret is
  # empty, the chart creates the Secret <release>-license.
  key: ""
  # -- The chart renders the license instance Secret and its Role only when
  # a key is configured here (key or existingSecret). Set true when the key
  # reaches kwatch another way, for example in the configSecretName Secret
  # or an extra environment variable, so the license can activate.
  instanceSecret: false

# -- Read-only dashboard: web UI and API. Pro only, off by default. Runs
# on its own listener and ClusterIP Service. The <release>-dashboard
# Secret holds the sign-in password (key password) and the API bearer
# token (key token); the chart generates both when dashboard.enabled is
# true and no existingSecret is set, and keeps them across upgrades.
dashboard:
  # -- Enable the dashboard listener and Service.
  enabled: false
  # -- Port for the dashboard listener (must not equal healthCheck.port).
  port: 8061
  # -- How people reach it. local: through kubectl port-forward (the
  # session cookie works over http://localhost). shared: through the
  # Ingress below, https only; kwatch refuses sign-in over plain http.
  mode: local
  # -- Name of an existing Secret with the keys `password` and `token`.
  # When empty and enabled is true, the chart creates the Secret.
  existingSecret: ""
  # -- Ingress for shared mode. host and tlsSecretName are required.
  ingress:
    # -- Address people open, for example kwatch.example.com.
    host: ""
    # -- IngressClass to use; empty uses the cluster default.
    className: ""
    # -- Secret that holds (or, with clusterIssuer, receives) the
    # certificate for host.
    tlsSecretName: ""
    # -- cert-manager ClusterIssuer that issues the certificate.
    clusterIssuer: ""
    # -- Extra Ingress annotations.
    annotations: {}
    # -- NetworkPolicy peers allowed to reach the dashboard in shared
    # mode (your ingress controller). Empty allows any source.
    networkPolicyFrom: []

# -- Use an existing Secret containing config.yaml and credential files.
# Required for alert providers and heartbeatMonitor.url. The Secret's
# config.yaml replaces `config` above; it is not merged.
#
# Limitations: the chart cannot read the Secret's config.yaml. Keep
# config.healthCheck.port in these values equal to the Secret's port, or
# the probes use the wrong port. To restart kwatch when the Secret
# changes, the chart hashes the Secret's data with Helm `lookup`, which
# only works against a live cluster: `helm template`, `--dry-run` and
# GitOps tools that render offline (such as Argo CD) see no Secret and
# hash the Secret name instead, so editing the Secret does not restart
# the Pod. Restart it yourself after a change
# (kubectl rollout restart on the kwatch Deployment), or use a new Secret
# name.
configSecretName: ""
