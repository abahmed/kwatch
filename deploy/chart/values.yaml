# Default values for kwatch.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Override the base name used in templates
nameOverride: ""
# -- Override the full app name used in templates
fullnameOverride: ""

image:
  repository: ghcr.io/abahmed/kwatch
  # -- Overrides the image tag (defaults to .Chart.AppVersion)
  tag: ""
  pullPolicy: IfNotPresent

securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

podSecurityContext:
  fsGroup: 1000

rbac:
  # -- Cluster read access. "full" grants list/watch on every resource so
  # any API kind can be watched, and get only on namespaces, nodes,
  # nodes/stats and nodes/metrics (kubelet stats, read from each kubelet
  # directly) and pods/log (crash output); a wildcard get is avoided
  # because it would also match pods/exec and similar subresources.
  # nodes/proxy is never granted. "least-privilege" grants an explicit
  # list/watch set matching the built-in sources and skips other kinds.
  # Both modes also grant get on pods in the release namespace only, to
  # explain why the previous kwatch Pod restarted, and get/update only on
  # kwatch's own leader-election Lease.
  mode: full

watch:
  # -- Watch Secrets. They feed checks such as missing Secret references
  # and certificate expiry; their values are hashed in kwatch's informer
  # cache and never stored or sent. false removes every Secret permission
  # in both RBAC modes (rbac.mode=full then uses the explicit
  # least-privilege list, because RBAC cannot remove one resource from a
  # wildcard), stops the Secret watch, lists Secret as
  # "disabled_by_config" in /health coverage, and checks that need
  # Secrets report that they cannot verify.
  secrets: true

# -- Time allowed for workers and persistence savers to stop cleanly.
terminationGracePeriodSeconds: 60

# -- Optional network isolation, disabled by default: the API server
# address, the kubelet port and every alert provider differ per cluster,
# and a policy that misses one silently stops monitoring or alerting.
# Enable it once you know your egress. With allowDefaults the policy admits
# the health port (kubelet probes, metrics) and lets kwatch reach DNS, TCP
# apiServerPorts on any address (the Kubernetes API server and HTTPS alert
# providers) and the kubelet on every node (kubeletPort, for node stats),
# limited to kubeletCIDRs when set (your node address ranges). Port 443
# covers HTTPS alert providers. A provider on any other port needs it in
# extraEgressPorts: the email provider uses SMTP (25, 465 or 587, matching
# its configured port) and a custom webhook may use its own port. Use
# ingress/egress for full rules (for example to limit a port to one
# address). Set allowDefaults=false only when your own rules cover the API
# server, kubelets and probes; without them kwatch cannot start.
networkPolicy:
  enabled: false
  allowDefaults: true
  apiServerPorts: [443, 6443]
  kubeletPort: 10250
  kubeletCIDRs: []
  # -- Extra TCP egress ports open to any address, e.g. [587] for SMTP.
  extraEgressPorts: []
  ingress: []
  egress: []

# -- kwatch sets the Go soft memory limit (GOMEMLIMIT) to 90% of the
# memory limit, so garbage collection works harder before the kernel would
# kill the Pod. A 5,000-pod cluster model needs about 100 MiB of live heap.
resources:
  limits:
    memory: 512Mi
    cpu: 100m
  requests:
    memory: 128Mi
    cpu: 100m

# -- State store volume. Kwatch keeps incidents, changes,
# baselines, evidence, timeline, audit, object fingerprints and state
# (thread IDs, notified version) in one file on it. Retention is enforced in
# the background and live data is capped at 512 MiB; the file is
# rewritten at startup once it passes 640 MiB, and that compaction copy
# shares the volume (peak about 1.2 GiB), so keep the volume at 2Gi or
# more. Set
# existingClaim to reuse a PVC, or emptyDir for evaluation clusters without
# storage. emptyDir loses all state when the pod is rescheduled or the node
# fails, so open incidents may be announced again after a restart.
persistence:
  size: 2Gi
  storageClass: ""
  existingClaim: ""
  emptyDir: false
  # -- sizeLimit applied to the emptyDir volume (emptyDir mode only).
  emptyDirSizeLimit: 2Gi
  # -- Keep kwatch on the nodes where the StorageClass's CSI driver is
  # registered when the driver runs on only some nodes; otherwise a
  # WaitForFirstConsumer claim placed on another node never binds. Looked
  # up at install and upgrade time; offline renders (helm template, Argo
  # CD) cannot look it up and render nothing.
  pinToStorageDriverNodes: true
  # -- The storage driver's topology label to require explicitly, for
  # offline renders (kubectl get csinodes shows each driver's topologyKeys).
  # A node carries it only once the driver is registered there.
  storageDriverTopologyKey: ""

nodeSelector: {}

# -- Extra tolerations. They are merged with defaultTolerations below: your
# list is rendered first and every default whose key and effect are not
# already used by one of your entries is appended, so setting this never
# drops the 30s not-ready/unreachable failover behavior. For example a
# not-ready NoSchedule entry keeps the default not-ready NoExecute one. To
# change a default, add an entry with the same key and effect (an entry
# with no effect covers every effect of its key).
tolerations: []

# -- Move off a failed node after 30s; the Lease stops the old pod writing.
# Merged with tolerations above (a user entry with the same key and effect
# wins).
defaultTolerations:
  - key: node.kubernetes.io/not-ready
    operator: Exists
    effect: NoExecute
    tolerationSeconds: 30
  - key: node.kubernetes.io/unreachable
    operator: Exists
    effect: NoExecute
    tolerationSeconds: 30

affinity: {}

podAnnotations: {}

sacAnnotations: {}

podLabels: {}

# kwatch configuration. kwatch watches every supported resource; use
# namespaces, reasons, namespaceSelector and silences to narrow what is
# delivered. The chart installs the KwatchConfig CRD and enables live
# configuration overlay by default.
#
# config.healthCheck.port sets the container port and the probe port. The
# health server cannot be disabled: the probes need it.
#
# Two outbound checks are on by default. Anonymous adoption telemetry
# sends an installation ID and the kwatch version at most once every 7
# days; the update check asks the GitHub API at startup and then daily
# whether a newer kwatch release exists, and posts one notice per release
# to your alert providers. Turn them off here, or in the Secret's
# config.yaml when configSecretName is set:
#
#   config:
#     telemetry:
#       enabled: false
#     upgrader:
#       disableUpdateCheck: true
config:
  crd:
    enabled: true

# -- Use an existing Secret containing config.yaml and credential files.
# Required for alert providers and heartbeatMonitor.url. The Secret's
# config.yaml replaces `config` above; it is not merged.
#
# Limitations: the chart cannot read the Secret's config.yaml. Keep
# config.healthCheck.port in these values equal to the Secret's port, or
# the probes use the wrong port. To restart kwatch when the Secret
# changes, the chart hashes the Secret's data with Helm `lookup`, which
# only works against a live cluster: `helm template`, `--dry-run` and
# GitOps tools that render offline (such as Argo CD) see no Secret and
# hash the Secret name instead, so editing the Secret does not restart
# the Pod. Restart it yourself after a change
# (kubectl rollout restart on the kwatch Deployment), or use a new Secret
# name.
configSecretName: ""
