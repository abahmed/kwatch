apiVersion: v1
kind: Namespace
metadata:
  name: kwatch
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: kwatch
  labels:
    app.kubernetes.io/instance: kwatch
    app.kubernetes.io/managed-by: kwatch.sh
rules:
# Least privilege: informers need list and watch; get is granted only
# where kwatch reads single objects (kubelet proxy, log excerpts, the
# kube-system Namespace for the cluster ID). Snapshot and Gateway API
# grants are optional enrichment for custom resource status.
- apiGroups: [""]
  resources: ["events", "nodes", "pods", "persistentvolumeclaims", "persistentvolumes", "configmaps", "secrets", "serviceaccounts", "resourcequotas", "limitranges", "services"]
  verbs: ["list", "watch"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["nodes/proxy", "pods/log"]
  verbs: ["get"]
- nonResourceURLs: ["/readyz"]
  verbs: ["get"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
  verbs: ["list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["list", "watch"]
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["list", "watch"]
- apiGroups: ["policy"]
  resources: ["poddisruptionbudgets"]
  verbs: ["list", "watch"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses", "networkpolicies"]
  verbs: ["list", "watch"]
- apiGroups: ["storage.k8s.io"]
  resources: ["storageclasses", "volumeattachments"]
  verbs: ["list", "watch"]
- apiGroups: ["admissionregistration.k8s.io"]
  resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations", "validatingadmissionpolicies", "validatingadmissionpolicybindings"]
  verbs: ["list", "watch"]
- apiGroups: ["certificates.k8s.io"]
  resources: ["certificatesigningrequests"]
  verbs: ["list", "watch"]
- apiGroups: ["flowcontrol.apiserver.k8s.io"]
  resources: ["flowschemas", "prioritylevelconfigurations"]
  verbs: ["list", "watch"]
- apiGroups: ["resource.k8s.io"]
  resources: ["resourceclaims"]
  verbs: ["list", "watch"]
- apiGroups: ["apiregistration.k8s.io"]
  resources: ["apiservices"]
  verbs: ["list", "watch"]
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["list"]
- apiGroups: ["snapshot.storage.k8s.io"]
  resources: ["volumesnapshots", "volumesnapshotcontents", "volumesnapshotclasses"]
  verbs: ["list", "watch"]
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["gatewayclasses", "gateways", "httproutes", "grpcroutes", "tcproutes", "tlsroutes", "referencegrants"]
  verbs: ["list", "watch"]
- apiGroups: ["kwatch.abahmed.dev"]
  resources: ["kwatchconfigs"]
  verbs: ["list", "watch"]
- apiGroups: ["authorization.k8s.io"]
  resources: ["selfsubjectaccessreviews"]
  verbs: ["create"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kwatch
  namespace: kwatch
  labels:
    app.kubernetes.io/instance: kwatch
    app.kubernetes.io/managed-by: kwatch.sh
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kwatch
  labels:
    app.kubernetes.io/instance: kwatch
    app.kubernetes.io/managed-by: kwatch.sh
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kwatch
subjects:
  - kind: ServiceAccount
    name: kwatch
    namespace: kwatch
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: kwatch-leader-election
  namespace: kwatch
  labels:
    app.kubernetes.io/instance: kwatch
    app.kubernetes.io/managed-by: kwatch.sh
rules:
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["create", "get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kwatch-leader-election
  namespace: kwatch
  labels:
    app.kubernetes.io/instance: kwatch
    app.kubernetes.io/managed-by: kwatch.sh
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kwatch-leader-election
subjects:
- kind: ServiceAccount
  name: kwatch
  namespace: kwatch
---
# The scheduler and controller-manager leader Leases show whether those
# control-plane components are alive.
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: kwatch-control-plane-leases
  namespace: kube-system
  labels:
    app.kubernetes.io/instance: kwatch
    app.kubernetes.io/managed-by: kwatch.sh
rules:
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kwatch-control-plane-leases
  namespace: kube-system
  labels:
    app.kubernetes.io/instance: kwatch
    app.kubernetes.io/managed-by: kwatch.sh
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kwatch-control-plane-leases
subjects:
- kind: ServiceAccount
  name: kwatch
  namespace: kwatch
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kwatch
  namespace: kwatch
  labels:
    app.kubernetes.io/instance: kwatch
    app.kubernetes.io/managed-by: kwatch.sh
spec:
  # One replica: the Lease is a lock that guarantees a single writer, and
  # Recreate keeps two pods from sharing the RWO data volume.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kwatch
      app.kubernetes.io/instance: kwatch
  template:
    metadata:
      labels:
        app: kwatch
        app.kubernetes.io/instance: kwatch
    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: 60
      serviceAccountName: kwatch
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 1000
      # Move off a failed node quickly; the Lease stops the old pod from
      # writing if it is still running.
      tolerations:
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 30
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 30
      containers:
      - name: kwatch
        image: ghcr.io/abahmed/kwatch:v0.10.5
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        ports:
          - name: health
            containerPort: 8060
        volumeMounts:
          - name: config-volume
            mountPath: /config
          - name: data
            mountPath: /var/lib/kwatch
        env:
          - name: CONFIG_FILE
            value: "/config/config.yaml"
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_UID
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: KWATCH_LEADER_ELECTION_NAME
            value: "kwatch-leader"
          - name: KWATCH_DATA_DIR
            value: "/var/lib/kwatch"
          - name: GOMEMLIMIT
            valueFrom:
              resourceFieldRef:
                resource: limits.memory
                divisor: "1"
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /availabilityz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            memory: "256Mi"
            cpu: "100m"
          requests:
            memory: "128Mi"
            cpu: "100m"
      volumes:
      - name: config-volume
        secret:
          secretName: kwatch
          defaultMode: 0400
      - name: data
        persistentVolumeClaim:
          claimName: kwatch-data
---
# State store: problems, history and delivery threads (ADR 0010). Uses the
# cluster's default StorageClass.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kwatch-data
  namespace: kwatch
  labels:
    app.kubernetes.io/instance: kwatch
    app.kubernetes.io/managed-by: kwatch.sh
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
