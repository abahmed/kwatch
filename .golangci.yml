version: "2"

linters:
  default: none
  enable:
    - errcheck
    - forbidigo
    - gocritic
    - gocyclo
    - govet
    - ineffassign
    - unparam
    - unused
  settings:
    forbidigo:
      forbid:
        # Providers must call delivery transport: it is the one place that
        # turns HTTP statuses into success / rate-limited / permanent /
        # retryable. A
        # provider with its own http.NewRequest gets its own status bugs.
        - pattern: '^http\.(NewRequest|NewRequestWithContext|Post|Get|Head|PostForm)$'
          msg: "alert providers must send through delivery transport, not raw net/http"
    govet:
      disable:
        - inline
    gocyclo:
      min-complexity: 20
    errcheck:
      exclude-functions:
        - "(*compress/gzip.Reader).Close"
        - "(*compress/gzip.Writer).Close"
        - "(*os.File).Close"
        - "(io.Closer).Close"
        - "(*bytes.Buffer).Write"
        - "(strings.Builder).WriteString"
        - "(fmt.Stringer).String"
  exclusions:
    generated: lax
    rules:
      # Tests intentionally ignore errors (e.g. seeding store/indexers).
      - path: "_test.go"
        linters: [errcheck, unparam, gocritic]
      # Informer wiring is declarative; ignoring AddEventHandler is noise.
      - path: "internal/controller"
        linters: [errcheck]
      # The raw-HTTP rule is only about alert providers; shared transport is
      # the one allowed production request boundary.
      - linters: [forbidigo]
        path-except: "^internal/alert/"

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/abahmed/kwatch
